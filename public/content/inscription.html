<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Inscrivez-vous pour rejoindre Luna Jewelry.">
    <link rel="icon" type="image/png" href="/images/logo.png">
    <title>Luna Jewelry - Inscription</title>
    <link rel="stylesheet" href="/style/styles.css">
</head>
<body>
    <header id="site-header"></header>
    <main>
        <div class="contenu">
            <div class="header">
                <h1>Inscription</h1>
                <p>Créez votre compte pour rejoindre Luna Jewelry.</p>
            </div>
            <form id="inscription">
                <div class="formulaire">
                    <label for="lastname">Nom</label>
                    <input type="text" id="lastname" placeholder="Votre nom" required>
                </div>
                <div class="formulaire">
                    <label for="firstname">Prénom</label>
                    <input type="text" id="firstname" placeholder="Votre prénom" required>
                </div>
                <div class="formulaire">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Votre email" required>
                </div>
                <div class="formulaire">
                    <label for="phone">Numéro de téléphone</label>
                    <input type="tel" id="phone" placeholder="Votre numéro (10 chiffres)" pattern="[0-9]{10}" required>
                </div>
                <div class="formulaire">
                    <label for="gender">Sexe</label>
                    <select id="gender" required>
                        <option value="">--Sélectionner--</option>
                        <option value="F">Femme</option>
                        <option value="M">Homme</option>
                    </select>
                </div>
                <div class="formulaire">
                    <label for="birthdate">Date de naissance</label>
                    <input type="date" id="birthdate" required>
                </div>
                <div class="formulaire">
                    <label for="password">Mot de passe</label>
                    <div class="input-group">
                        <input type="password" id="password" placeholder="Votre mot de passe" required>

                    </div>
                </div>
                <div class="formulaire">
                    <label for="confirm-password">Confirmer le mot de passe</label>
                    <div class="input-group">
                        <input type="password" id="confirm-password" placeholder="Confirmer le mot de passe" required>

                    </div>
                </div>
                <p id="password-match-error" class="error">Les mots de passe ne correspondent pas.</p>
                <p id="password-strength-error" class="error">Le mot de passe doit contenir au moins 8 caractères, une majuscule, une minuscule, un chiffre et un caractère spécial.</p>
                <p id="form-error" class="error"></p>
                <button type="submit" class="submit-btn">S'inscrire</button>
            </form>
            <p class="link">Déjà un compte ? <a href="/content/authentification.html">Connectez-vous</a></p>
            <div class="social-connexion">
                <button class="btn social google"><img src="/images/google.png" alt="Google"> S'inscrire avec Google</button>
            </div>
        </div>
    </main>
    <footer id="site-footer"></footer>
    <script src="/javascript/api.js"></script>
    <script src="/javascript/header.js"></script>
    <script src="/javascript/script.js"></script>
    <script src="/javascript/auth.js"></script>
</body>
</html>
