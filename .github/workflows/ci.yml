name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: cp .env.example .env
      - run: npm ci
      - run: npm run db:up
      - run: npm run db:setup
      - run: npm test
      - if: always()
        run: docker compose down -v
